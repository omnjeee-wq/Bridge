openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Murph Stream Bridge control plane API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bridge
    description: Bridge status and settings
  - name: repositories
    description: Plugin repository management
  - name: plugins
    description: Plugin management
  - name: activity
    description: Operational activity
  - name: jvm
    description: JVM CloudStream runtime
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /bridge/status:
    get:
      operationId: getBridgeStatus
      tags: [bridge]
      summary: Get bridge status
      responses:
        "200":
          description: Current bridge state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BridgeStatus"
  /bridge/settings:
    get:
      operationId: getBridgeSettings
      tags: [bridge]
      summary: Get bridge settings
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BridgeSettings"
    patch:
      operationId: updateBridgeSettings
      tags: [bridge]
      summary: Update bridge settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BridgeSettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BridgeSettings"
  /repositories:
    get:
      operationId: listRepositories
      tags: [repositories]
      summary: List configured repositories
      responses:
        "200":
          description: Configured repositories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Repository"
    post:
      operationId: addRepository
      tags: [repositories]
      summary: Add a plugin repository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepositoryInput"
      responses:
        "201":
          description: Repository added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
        "400":
          description: Invalid repository URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /repositories/{id}:
    delete:
      operationId: deleteRepository
      tags: [repositories]
      summary: Remove a repository
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Repository removed
        "404":
          description: Repository not found
  /repositories/{id}/refresh:
    post:
      operationId: refreshRepository
      tags: [repositories]
      summary: Refresh a repository
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Refreshed repository
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
  /repositories/{id}/toggle:
    post:
      operationId: toggleRepository
      tags: [repositories]
      summary: Enable or disable a repository
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Updated repository
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
        "404":
          description: Repository not found
  /plugins:
    get:
      operationId: listPlugins
      tags: [plugins]
      summary: List available and installed plugins
      responses:
        "200":
          description: Plugin catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plugin"
  /plugins/{id}/toggle:
    post:
      operationId: togglePlugin
      tags: [plugins]
      summary: Enable or disable a plugin
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Updated plugin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plugin"
        "404":
          description: Plugin not found
  /plugins/{id}:
    delete:
      operationId: uninstallPlugin
      tags: [plugins]
      summary: Uninstall a plugin
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Plugin uninstalled
        "404":
          description: Plugin not found
  /activity:
    get:
      operationId: listActivity
      tags: [activity]
      summary: List recent bridge activity
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEntry"
  /stats:
    get:
      operationId: getBridgeStats
      tags: [bridge]
      summary: Get dashboard summary metrics
      responses:
        "200":
          description: Bridge summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BridgeStats"
  /bridge/test-stream:
    get:
      operationId: testBridgeStream
      tags: [bridge]
      summary: Test stream forwarding
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [movie, series]
        - name: id
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 240
      responses:
        "200":
          description: Stream forwarding test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamTestResponse"
  /jvm/info:
    get:
      operationId: getJvmInfo
      tags: [jvm]
      summary: Get JVM runtime information
      description: Returns JVM CloudStream runtime status, health, and resource usage
      responses:
        "200":
          description: JVM runtime information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JvmInfo"
        "503":
          description: JVM runtime not enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    BridgeStatus:
      type: object
      properties:
        state:
          type: string
          enum: [online, degraded, offline]
        version:
          type: string
        uptimeSeconds:
          type: number
        activePlugins:
          type: number
        totalPlugins:
          type: number
        manifestUrl:
          type: string
        dataDirectory:
          type: string
      required: [state, version, uptimeSeconds, activePlugins, totalPlugins, manifestUrl, dataDirectory]
    BridgeSettings:
      type: object
      properties:
        displayName:
          type: string
        description:
          type: string
        autoRefresh:
          type: boolean
        refreshIntervalMinutes:
          type: number
          minimum: 5
          maximum: 1440
        allowRemoteControl:
          type: boolean
      required: [displayName, description, autoRefresh, refreshIntervalMinutes, allowRemoteControl]
    BridgeSettingsUpdate:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 240
        autoRefresh:
          type: boolean
        refreshIntervalMinutes:
          type: number
          minimum: 5
          maximum: 1440
        allowRemoteControl:
          type: boolean
    RepositoryInput:
      type: object
      properties:
        url:
          type: string
          minLength: 8
          maxLength: 2048
      required: [url]
    Repository:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
        name:
          type: string
        description:
          type: string
        pluginCount:
          type: number
        status:
          type: string
          enum: [ready, syncing, error]
        lastSyncedAt:
          type: ["string", "null"]
        error:
          type: ["string", "null"]
        enabled:
          type: boolean
        logoUrl:
          type: ["string", "null"]
      required: [id, url, name, description, pluginCount, status, lastSyncedAt, error, enabled, logoUrl]
    Plugin:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        version:
          type: string
        repositoryId:
          type: string
        category:
          type: string
        supportedTypes:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        installed:
          type: boolean
        status:
          type: string
          enum: [active, disabled, available, error]
        logoUrl:
          type: ["string", "null"]
      required: [id, name, description, version, repositoryId, category, supportedTypes, enabled, installed, status, logoUrl]
    ActivityEntry:
      type: object
      properties:
        id:
          type: string
        level:
          type: string
          enum: [info, success, warning, error]
        message:
          type: string
        createdAt:
          type: string
      required: [id, level, message, createdAt]
    BridgeStats:
      type: object
      properties:
        requestsToday:
          type: number
        requestsChange:
          type: number
        cacheHitRate:
          type: number
        avgResponseMs:
          type: number
        activeConnections:
          type: number
      required: [requestsToday, requestsChange, cacheHitRate, avgResponseMs, activeConnections]
    StreamTestSource:
      type: object
      properties:
        name:
          type: string
        url:
          type: string
        status:
          type: string
          enum: [ok, error]
        streamCount:
          type: number
        error:
          type: ["string", "null"]
      required: [name, url, status, streamCount, error]
    StreamTestResponse:
      type: object
      properties:
        type:
          type: string
        id:
          type: string
        streamCount:
          type: number
        streams:
          type: array
          items:
            type: object
            additionalProperties: true
        sources:
          type: array
          items:
            $ref: "#/components/schemas/StreamTestSource"
      required: [type, id, streamCount, streams, sources]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    JvmInfo:
      type: object
      properties:
        enabled:
          type: boolean
        status:
          type: string
          enum: [stopped, starting, running, error, stopping]
        pid:
          type: ["integer", "null"]
        uptimeSeconds:
          type: ["number", "null"]
        restarts:
          type: number
        lastError:
          type: ["string", "null"]
        version:
          type: ["string", "null"]
        memoryUsage:
          type: ["object", "null"]
          properties:
            heapUsed:
              type: number
            heapTotal:
              type: number
            external:
              type: number
            rss:
              type: number
        cpuUsage:
          type: ["object", "null"]
          properties:
            user:
              type: number
            system:
              type: number
        config:
          type: object
          properties:
            port:
              type: number
            sourceRepo:
              type: string
            sourceRef:
              type: string
            cacheDir:
              type: string
            autoRestart:
              type: boolean
            maxRestarts:
              type: number
            restartDelayMs:
              type: number
      required: [enabled, status, pid, uptimeSeconds, restarts, lastError, version, config]

